<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ETERNAL</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/alerts.css">
</head>

<body>

    <div class="app">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="logo">
                <img src="../photos/logo.png" alt="ETERNAL Logo">
            </div>

            <nav class="sidebar-nav">

                <a href="/" class="nav-item">
                    <span class="nav-icon">⌂</span>
                    <span>Dashboard</span>
                </a>

                <a href="/events" class="nav-item">
                    <span class="nav-icon">▤</span>
                    <span>Events</span>
                </a>

                <a href="/alerts" class="nav-item">
                    <span class="nav-icon">⚠</span>
                    <span>Alerts</span>
                </a>

                <a href="/agents" class="nav-item">
                    <span class="nav-icon">◉</span>
                    <span>Agents</span>
                </a>

                <a href="/network" class="nav-item">
                    <span class="nav-icon">⌁</span>
                    <span>Network</span>
                </a>

                <a href="/incidents" class="nav-item">
                    <span class="nav-icon">◫</span>
                    <span>Incidents</span>
                </a>

            </nav>

            <div class="sidebar-bottom">
                <a href="/settings" class="nav-item">
                    <span class="nav-icon">⚙</span>
                    <span>Settings</span>
                </a>
            </div>

        </aside>

        <!-- MAIN CONTENT -->
        <main class="main">

            <!-- TOP BAR -->
            <header class="topbar">

                <div class="page-title">
                    <h1>Alerts</h1>
                </div>

                <div class="topbar-right">

                    <div class="search">
                        <span class="search-icon">⌕</span>
                        <input type="text" placeholder="Search..." id="global-search">
                    </div>

                    <div class="date" id="current-date"></div>

                </div>

            </header>

            <!-- ALERTS CONTENT -->
            <section class="alerts-page">

                <!-- FILTER BAR -->
                <div class="alerts-controls">

                    <div class="alert-search">
                        <span>⌕</span>
                        <input type="text" id="alert-search" placeholder="Search alerts...">
                    </div>

                    <select id="severity-filter">
                        <option value="">Severity</option>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                        <option value="Critical">Critical</option>
                    </select>

                    <select id="alert-type-filter">
                        <option value="">Alert Type</option>
                    </select>

                    <select id="agent-filter">
                        <option value="">Agent</option>
                    </select>

                    <select id="status-filter">
                        <option value="">Status</option>
                        <option value="New">New</option>
                        <option value="Investigating">Investigating</option>
                        <option value="Resolved">Resolved</option>
                    </select>

                    <button class="reset-btn" id="reset-filters">
                        Reset
                    </button>

                    <button class="refresh-btn" id="refresh-alerts">
                        ↻ Refresh
                    </button>

                </div>

                <!-- ALERT TABLE -->
                <div class="alerts-table-card">

                    <div class="table-header">
                        <div>
                            <h2>Security Alerts</h2>
                            <span id="alert-count"></span>
                        </div>
                    </div>

                    <div class="table-wrapper">

                        <table class="alerts-table">

                            <thead>
                                <tr>
                                    <th>Time</th>
                                    <th>Alert</th>
                                    <th>Rule</th>
                                    <th>Agent</th>
                                    <th>Source IP</th>
                                    <th>Severity</th>
                                    <th>Status</th>
                                    <th></th>
                                </tr>
                            </thead>

                            <tbody id="alerts-table-body"></tbody>

                        </table>

                    </div>

                    <!-- PAGINATION -->
                    <div class="pagination">

                        <span class="pagination-info" id="pagination-info"></span>

                        <div class="pagination-buttons" id="pagination-buttons"></div>

                    </div>

                </div>

            </section>

        </main>

    </div>


    <!-- ALERT DETAILS DRAWER -->
    <aside class="alert-drawer" id="alert-drawer">

        <div class="drawer-header">

            <div>

                <span class="drawer-label">
                    ALERT DETAILS
                </span>

                <h2 id="drawer-title"></h2>

            </div>

            <button class="drawer-close" id="drawer-close">
                ×
            </button>

        </div>

        <div class="drawer-content">

            <div class="drawer-badges">

                <span class="severity" id="drawer-severity"></span>

                <span class="status-badge" id="drawer-status"></span>

            </div>

            <div class="alert-description" id="drawer-description">
            </div>

            <!-- ALERT INFORMATION -->
            <div class="alert-details-grid">

                <div class="detail-item">
                    <span>Alert ID</span>
                    <strong id="detail-id"></strong>
                </div>

                <div class="detail-item">
                    <span>Rule</span>
                    <strong id="detail-rule"></strong>
                </div>

                <div class="detail-item">
                    <span>Agent</span>
                    <strong id="detail-agent"></strong>
                </div>

                <div class="detail-item">
                    <span>Source IP</span>
                    <strong id="detail-ip"></strong>
                </div>

                <div class="detail-item">
                    <span>First Seen</span>
                    <strong id="detail-first-seen"></strong>
                </div>

                <div class="detail-item">
                    <span>Last Seen</span>
                    <strong id="detail-last-seen"></strong>
                </div>

                <div class="detail-item">
                    <span>Related Events</span>
                    <strong id="detail-events"></strong>
                </div>

            </div>

            <!-- DETECTION LOGIC -->
            <div class="detection-section">

                <h3>Detection Logic</h3>

                <div class="detection-box" id="detection-logic">
                </div>

            </div>

            <!-- ACTIONS -->
            <div class="drawer-actions">

                <button class="investigate-btn" id="investigate-btn">
                    Mark as Investigating
                </button>

                <button class="resolve-btn" id="resolve-btn">
                    Resolve
                </button>

            </div>

        </div>

    </aside>


    <!-- JAVASCRIPT -->
    <script src="../js/script.js"></script>
    <script src="../js/alerts.js"></script>

</body>

</html>
