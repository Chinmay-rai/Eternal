<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETERNAL</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/network.css">
</head>

<body>
    <div class="app">

        
<aside class="sidebar">

    <div class="logo">
        <img src="../photos/logo.png">
    </div>

    <nav class="sidebar-nav">

        <a href="/" class="nav-item">
            <span class="nav-icon">⌂</span>
            <span>Dashboard</span>
        </a>

        <a href="/events" class="nav-item">
            <span class="nav-icon">▤</span>
            <span>Events</span>
        </a>

        <a href="/alerts" class="nav-item">
            <span class="nav-icon">⚠</span>
            <span>Alerts</span>
        </a>

        <a href="/agents" class="nav-item">
            <span class="nav-icon">◉</span>
            <span>Agents</span>
        </a>

        <a href="/network" class="nav-item">
            <span class="nav-icon">⌁</span>
            <span>Network</span>
        </a>

        <a href="/incidents" class="nav-item">
            <span class="nav-icon">◫</span>
            <span>Incidents</span>
        </a>

    </nav>

    <div class="sidebar-bottom">

        <a href="/settings" class="nav-item">
            <span class="nav-icon">⚙</span>
            <span>Settings</span>
        </a>

    </div>

</aside>


        <main class="main">

            <header class="topbar">
                <div class="page-title">
                    <h1>Network</h1>
                </div>

                <div class="topbar-right">
                    <div class="search">
                        <span class="search-icon">⌕</span>
                        <input type="text" placeholder="Search..." id="global-search">
                    </div>

                    <div class="date" id="current-date"></div>
                    
                </div>
            </header>

            <section class="network-content">

                <div class="network-card scan-card">

                    <div class="card-header">
                        <div>
                            <h2>TCP Port Scanner</h2>
                            <p>Scan an authorized target for accessible TCP ports</p>
                        </div>
                    </div>

                    <div class="scan-form">

                        <div class="form-group">
                            <label for="target-ip">Target IP Address</label>
                            <input
                                type="text"
                                id="target-ip"
                                placeholder="192.168.1.100"
                                autocomplete="off"
                            >
                        </div>

                        <div class="form-group">
                            <label for="port-range">Scan Profile</label>
                            <select id="port-range">
                                <option value="1-100">Quick Scan (1–100)</option>
                                <option value="1-1024" selected>Standard Scan (1–1024)</option>
                                <option value="1-10000">Extended Scan (1–10,000)</option>
                                <option value="1-65535">Full TCP Scan (1–65,535)</option>
                            </select>
                        </div>

                        <button id="start-scan" class="scan-button" type="button">
                            Start Scan
                        </button>

                    </div>

                    <div id="scan-status" class="scan-status"
                         role="status" aria-live="polite"></div>

                </div>

                <div class="network-card results-card">

                    <div class="card-header">
                        <div>
                            <h2>Scan Results</h2>
                            <p>Results from the latest TCP scan</p>
                        </div>

                        <span id="result-count" class="result-count">
                            0 open ports
                        </span>
                    </div>

                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Port</th>
                                    <th>State</th>
                                    <th>Service</th>
                                </tr>
                            </thead>

                            <tbody id="scan-results-body">
                                <tr class="empty-row">
                                    <td colspan="3">No scan results available</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                </div>

            </section>
        </main>
    </div>

    <script src="../js/script.js"></script>
    <script src="../js/network.js"></script>
</body>
</html>
